server{
    listen 80;
    listen [::]:80;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_name kkraft.42.fr;

    root /var/www/wordpress;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
    }
}
